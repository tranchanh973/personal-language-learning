<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小中文 · Chinese Quest</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#243047;background:#f7fafc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{background:white;border-right:2px solid #e8eef4;padding:25px 17px;position:sticky;top:0;height:100vh}.logo{font-weight:900;font-size:24px;color:#58b92b;margin-bottom:30px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{background:transparent;border:0;text-align:left;padding:13px 16px;border-radius:14px;font-weight:800;color:#64748b}.nav button.active{color:#3a9c1d;background:#eaf8e7;border:2px solid #a8e394}.main{padding:26px;max-width:1100px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.tag{background:#fff1d5;color:#b87512;padding:9px 14px;border-radius:20px;font-weight:800}.hero{background:linear-gradient(115deg,#58c42e,#85db45);color:white;border-radius:25px;padding:30px;box-shadow:0 7px #399f1c}.hero h1{margin:0 0 10px;font-size:30px}.hero p{max-width:560px}.btn{border:0;border-radius:15px;padding:13px 19px;font-weight:900;background:#58cc32;color:white;box-shadow:0 4px #42a725}.btn:active{transform:translateY(3px);box-shadow:0 1px #42a725}.btn.secondary{background:#fff;color:#46a622;box-shadow:0 4px #d9e3d7}.btn.orange{background:#ffad31;box-shadow:0 4px #d68a13}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:23px 0}.card{background:white;border:2px solid #e7edf4;border-radius:20px;padding:21px}.card h3{margin:0 0 12px}.metric{font-size:29px;font-weight:900;color:#27374a}.muted{color:#718096}.bar{height:12px;border-radius:20px;background:#e7edf4;overflow:hidden}.fill{height:100%;background:#58cc32;border-radius:20px}.section{margin-top:25px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{display:inline-block;padding:6px 12px;background:#e8f7e4;border-radius:20px;color:#398c22;font-weight:800}.wordgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.hanzi{font-size:36px;font-weight:800;margin:7px 0}.flash{border:3px solid #d8e8f4;border-radius:24px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fff;cursor:pointer;padding:25px;margin:20px 0}.flash .hanzi{font-size:70px}.choice{width:100%;text-align:left;background:white;border:2px solid #e0e8f0;border-radius:15px;padding:16px;margin:7px 0;font-weight:750}.choice:hover{border-color:#58cc32;background:#f5fff1}.choice.correct{background:#dff7d7;border-color:#58cc32}.choice.wrong{background:#ffe4e2;border-color:#f36d66}.hidden{display:none!important}.feedback{padding:16px;border-radius:14px;margin:15px 0;background:#f0f7ff}.lesson{border-left:5px solid #58cc32;margin-bottom:13px}.footer-nav{display:none}select,input{border:2px solid #e1e8ee;border-radius:12px;padding:10px;background:white;max-width:100%}@media(max-width:760px){.app{display:block}.sidebar{display:none}.main{padding:16px 14px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px}.hero h1{font-size:25px}.footer-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #e8eef4;display:flex;justify-content:space-around;z-index:3;padding:7px 2px}.footer-nav button{border:0;background:none;font-size:11px;font-weight:800;color:#66758b;padding:8px 3px}.footer-nav button.active{color:#43a524}.metric{font-size:24px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">🐼 小中文</div><nav class="nav" id="desktopNav"></nav></aside><main class="main"><div class="top"><strong>🇨🇳 Chinese Quest <span class="muted">· HSK 1–2</span></strong><span class="tag" id="xpTag">⭐ 0 XP</span></div><div id="view"></div></main></div><nav class="footer-nav" id="mobileNav"></nav><script>
const words=[
['你好','nǐ hǎo','Xin chào','HSK 1','你好！','nǐ hǎo!','Xin chào!','ni-hao'],['谢谢','xièxie','Cảm ơn','HSK 1','谢谢你。','xièxie nǐ.','Cảm ơn bạn.','xie-xie'],['我','wǒ','Tôi','HSK 1','我是学生。','wǒ shì xuésheng.','Tôi là học sinh.','wo'],['你','nǐ','Bạn','HSK 1','你好吗？','nǐ hǎo ma?','Bạn khỏe không?','ni'],['是','shì','Là','HSK 1','他是老师。','tā shì lǎoshī.','Anh ấy là giáo viên.','shi'],['学生','xuésheng','Học sinh','HSK 1','我是学生。','wǒ shì xuésheng.','Tôi là học sinh.','xue-sheng'],['老师','lǎoshī','Giáo viên','HSK 1','她是老师。','tā shì lǎoshī.','Cô ấy là giáo viên.','lao-shi'],['喜欢','xǐhuan','Thích','HSK 1','我喜欢茶。','wǒ xǐhuan chá.','Tôi thích trà.','xi-huan'],['喝','hē','Uống','HSK 1','我喝水。','wǒ hē shuǐ.','Tôi uống nước.','he'],['水','shuǐ','Nước','HSK 1','我喝水。','wǒ hē shuǐ.','Tôi uống nước.','shui'],['朋友','péngyou','Bạn bè','HSK 1','他是我的朋友。','tā shì wǒ de péngyou.','Anh ấy là bạn tôi.','peng-you'],['学习','xuéxí','Học tập','HSK 1','我学习中文。','wǒ xuéxí zhōngwén.','Tôi học tiếng Trung.','xue-xi'],['因为','yīnwèi','Bởi vì','HSK 2','因为下雨，我不去。','yīnwèi xià yǔ, wǒ bú qù.','Vì trời mưa nên tôi không đi.','yin-wei'],['所以','suǒyǐ','Cho nên','HSK 2','我累了，所以休息。','wǒ lèi le, suǒyǐ xiūxi.','Tôi mệt nên nghỉ ngơi.','suo-yi'],['已经','yǐjīng','Đã','HSK 2','我已经吃饭了。','wǒ yǐjīng chī fàn le.','Tôi đã ăn cơm rồi.','yi-jing'],['觉得','juéde','Cảm thấy, cho rằng','HSK 2','我觉得很好。','wǒ juéde hěn hǎo.','Tôi thấy rất tốt.','jue-de'],['一起','yìqǐ','Cùng nhau','HSK 2','我们一起学习。','wǒmen yìqǐ xuéxí.','Chúng ta cùng học.','yi-qi'],['运动','yùndòng','Vận động, thể thao','HSK 2','我喜欢运动。','wǒ xǐhuan yùndòng.','Tôi thích thể thao.','yun-dong']];
const lessons=[{id:'greetings',title:'Chào hỏi và giới thiệu',level:'HSK 1',text:'Mẫu câu: 我是学生。 (wǒ shì xuésheng.) — Tôi là học sinh.',note:'Cấu trúc: Chủ ngữ + 是 (shì — là) + danh từ. Ví dụ: 她是老师。 (tā shì lǎoshī.) — Cô ấy là giáo viên.'},{id:'interests',title:'Sở thích và sinh hoạt',level:'HSK 1',text:'Mẫu câu: 我喜欢喝茶。 (wǒ xǐhuan hē chá.) — Tôi thích uống trà.',note:'Cấu trúc: Chủ ngữ + 喜欢 (xǐhuan — thích) + động từ hoặc danh từ.'},{id:'cause-effect',title:'Nguyên nhân và kết quả',level:'HSK 2',text:'Mẫu câu: 因为下雨，所以我不去。 (yīnwèi xià yǔ, suǒyǐ wǒ bú qù.) — Vì trời mưa nên tôi không đi.',note:'Cấu trúc: 因为 (yīnwèi — bởi vì) + nguyên nhân, 所以 (suǒyǐ — cho nên) + kết quả.'}];
const KEY = 'chinese-quest-mvp-v1';
const PROGRESS_VERSION = 2;
// The order of these IDs must match the original unversioned prototype.
const legacyWordIds = ["ni-hao", "xie-xie", "wo", "ni", "shi", "xue-sheng", "lao-shi", "xi-huan", "he", "shui", "peng-you", "xue-xi", "yin-wei", "suo-yi", "yi-jing", "jue-de", "yi-qi", "yun-dong"];
const legacyLessonIds = ["greetings", "interests", "cause-effect"];

function normalizeProgress(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('Invalid progress');
  if (raw.version !== undefined && raw.version !== PROGRESS_VERSION) {
    throw new Error('Unsupported progress version');
  }
  const legacy = raw.version === undefined;
  const resolveId = (value, ids) => legacy
    ? (/^(0|[1-9]\d*)$/.test(String(value)) ? ids[Number(value)] : undefined)
    : (typeof value === 'string' && value ? value : undefined);
  const normalizeIds = (values, ids) =>
    [...new Set((Array.isArray(values) ? values : []).map(value => resolveId(value, ids)).filter(Boolean))];
  const reviews = Object.fromEntries(Object.entries(raw.reviews || {}).flatMap(([key, review]) => {
    const id = resolveId(key, legacyWordIds);
    if (!id || !Number.isInteger(review?.step) || review.step < 0 || review.step > 5 ||
        !Number.isFinite(review.next)) return [];
    return [[id, {step: review.step, next: review.next}]];
  }));
  const count = value => Number.isSafeInteger(value) && value >= 0 ? value : 0;
  const quizTotal = count(raw.quizTotal);
  return {
    version: PROGRESS_VERSION,
    xp: count(raw.xp),
    learned: normalizeIds(raw.learned, legacyWordIds),
    reviews,
    completed: normalizeIds(raw.completed, legacyLessonIds),
    days: [...new Set(Array.isArray(raw.days) ? raw.days.filter(day => typeof day === 'string') : [])],
    quizCorrect: Math.min(count(raw.quizCorrect), quizTotal),
    quizTotal
  };
}

let data;
try {
  data = normalizeProgress(JSON.parse(localStorage.getItem(KEY)) || {});
} catch {
  data = normalizeProgress({});
}
let tab = 'home', level = 'all', cardIndex = 0, flipped = false, quiz = null;
const revealedReviews = new Set();
const $ = id => document.getElementById(id);
function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
  $('xpTag').textContent = '⭐ ' + data.xp + ' XP';
}
function stamp() {
  const day = new Date().toLocaleDateString('en-CA');
  if (!data.days.includes(day)) data.days.push(day);
}
function earn(points) {
  data.xp += points;
  stamp();
  save();
}
const tabs=[['home','🏠','Trang chủ'],['lessons','📚','Bài học'],['words','🀄','Từ vựng'],['flash','🃏','Flashcard'],['quiz','🎯','Quiz'],['review','🔁','Ôn tập']];function nav(){for(const id of ['desktopNav','mobileNav'])$(id).innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]} ${t[2]}</button>`).join('')};function go(t){tab=t;revealedReviews.clear();render();window.scrollTo(0,0)}function speak(i){if(!('speechSynthesis'in window)){alert('Trình duyệt chưa hỗ trợ đọc văn bản.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[i][0]);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}function due(i) {
  return data.reviews[words[i][7]]?.next <= Date.now();
}
function schedule(i, good) {
  const id = words[i][7];
  const step = good ? Math.min((data.reviews[id]?.step || 0) + 1, 5) : 0;
  const delay = good ? [1, 3, 7, 14, 30][step - 1] * 86400000 : 0;
  data.reviews[id] = {step, next: Date.now() + delay};
  if (good && !data.learned.includes(id)) data.learned.push(id);
}
function render(){nav();save();let v=$('view');if(tab==='home'){let learned=words.filter(w=>data.learned.includes(w[7])).length,percent=Math.round(learned/words.length*100),pending=words.filter((_,i)=>due(i)).length;v.innerHTML=`<section class="hero"><h1>你好！(nǐ hǎo) 👋</h1><p>Chào mừng trở lại! Mỗi ngày một chút, tiếng Trung sẽ dễ hơn rất nhiều.</p><button class="btn secondary" onclick="go('lessons')">🚀 Bắt đầu học</button></section><div class="grid"><div class="card"><div class="muted">⚡ Tổng XP</div><div class="metric">${data.xp}</div></div><div class="card"><div class="muted">🧠 Từ đã học</div><div class="metric">${learned}/${words.length}</div></div><div class="card"><div class="muted">🔥 Ngày đã học</div><div class="metric">${data.days.length}</div></div></div><div class="card"><div class="row"><h3>🎯 Tiến độ từ vựng</h3><b>${percent}%</b></div><div class="bar"><div class="fill" style="width:${percent}%"></div></div><p class="muted">${pending} từ đến hạn ôn · ${lessons.filter(l=>data.completed.includes(l.id)).length}/${lessons.length} bài học hoàn thành</p></div><section class="section"><h2>✨ Nhiệm vụ hôm nay</h2><div class="grid"><div class="card"><h3>📚 Học bài mới</h3><p class="muted">Ngữ pháp có ví dụ dễ hiểu.</p><button class="btn" onclick="go('lessons')">Học ngay</button></div><div class="card"><h3>🃏 Học flashcard</h3><p class="muted">Ghi nhớ chữ Hán và Pinyin.</p><button class="btn" onclick="go('flash')">Lật thẻ</button></div><div class="card"><h3>🎯 Làm quiz</h3><p class="muted">Kiểm tra kiến thức, nhận XP.</p><button class="btn orange" onclick="go('quiz')">Thử sức</button></div></div></section>`}
if(tab==='lessons')v.innerHTML=`<h1>📚 Lộ trình học HSK 1–2</h1><p class="muted">Học theo chủ đề, từ dễ đến khó. Đây là các bài mẫu của MVP.</p>${lessons.map((l,i)=>`<article class="card lesson"><div class="row"><h3>${i+1}. ${l.title}</h3><span class="pill">${l.level}</span></div><p>${l.text}</p><p class="muted">${l.note}</p><button class="btn ${data.completed.includes(lessons[i].id)?'secondary':''}" onclick="complete(${i})">${data.completed.includes(lessons[i].id)?'✓ Đã hoàn thành':'✓ Đánh dấu hoàn thành (+20 XP)'}</button></article>`).join('')}`;
if(tab==='words'){let ids=words.map((w,i)=>i).filter(i=>level==='all'||words[i][3]===level);v.innerHTML=`<div class="row"><div><h1>🀄 Kho từ vựng</h1><p class="muted">${words.length} từ mẫu · chữ Hán, Pinyin, nghĩa và ví dụ</p></div><select onchange="level=this.value;render()"><option value="all" ${level==='all'?'selected':''}>Tất cả</option><option value="HSK 1" ${level==='HSK 1'?'selected':''}>HSK 1</option><option value="HSK 2" ${level==='HSK 2'?'selected':''}>HSK 2</option></select></div><div class="wordgrid">${ids.map(i=>`<div class="card"><span class="pill">${words[i][3]}</span><div class="hanzi">${words[i][0]}</div><b>${words[i][1]}</b><p>${words[i][2]}</p><p class="muted" style="font-size:13px">${words[i][4]}<br>${words[i][5]}<br>${words[i][6]}</p><div class="row"><button class="btn secondary" onclick="speak(${i})">🔊 Nghe</button><span>${data.learned.includes(words[i][7])?'✅ Đã học':''}</span></div></div>`).join('')}</div>`}
if(tab==='flash'){let w=words[cardIndex];v.innerHTML=`<div class="row"><h1>🃏 Flashcard</h1><span class="pill">${cardIndex+1}/${words.length}</span></div><p class="muted">Chạm vào thẻ để xem nghĩa. Chọn “Đã nhớ” để lên lịch ôn tập.</p><div class="flash" onclick="flipped=!flipped;render()">${flipped?`<h1>${w[2]}</h1><h3>${w[4]}</h3><p>${w[5]}</p><p>${w[6]}</p>`:`<div class="hanzi">${w[0]}</div><h2>${w[1]}</h2>`}<small class="muted">↻ Chạm để lật thẻ</small></div><div class="row"><button class="btn secondary" onclick="speak(${cardIndex})">🔊 Phát âm</button><button class="btn orange" onclick="markFlash(false)">🔁 Chưa nhớ</button><button class="btn" onclick="markFlash(true)">✓ Đã nhớ</button></div>`}
if(tab==='quiz')renderQuiz(v);if(tab==='review'){let ids=words.map((_,i)=>i).filter(due);v.innerHTML=`<h1>🔁 Ôn tập thông minh</h1><p class="muted">Lịch lặp lại ngắt quãng: 1, 3, 7, 14 và 30 ngày. Từ trả lời sai được ôn lại ngay.</p><div class="grid"><div class="card"><div class="muted">Đến hạn ôn</div><div class="metric">${ids.length}</div></div><div class="card"><div class="muted">Đã ghi nhớ</div><div class="metric">${words.filter(w=>data.learned.includes(w[7])).length}</div></div><div class="card"><div class="muted">Quiz đúng</div><div class="metric">${data.quizTotal?Math.round(data.quizCorrect/data.quizTotal*100):0}%</div></div></div>${ids.length?`<div class="wordgrid">${ids.map(i=>`<div class="card"><div class="hanzi">${words[i][0]}</div><b>${words[i][1]}</b>${revealedReviews.has(words[i][7])
  ? `<p>${words[i][2]}</p><button class="btn" onclick="rateReview(${i}, true)">✓ Đã nhớ</button> <button class="btn secondary" onclick="rateReview(${i}, false)">Ôn lại</button>`
  : `<p><button class="btn secondary" onclick="revealReview(${i})">Xem nghĩa</button></p>`}</div>`).join('')}</div>`:'<div class="card">🎉 Hiện không có từ đến hạn! Học flashcard để tạo lịch ôn mới.</div>'}<p><button class="btn secondary" onclick="exportData()">⬇️ Xuất tiến độ JSON</button> <label class="btn secondary" style="display:inline-block">⬆️ Nhập tiến độ <input type="file" accept="application/json" onchange="importData(this)" style="display:none"></label></p><p class="muted">Tiến độ lưu trong trình duyệt này. Có thể mất nếu xóa dữ liệu trình duyệt; hãy xuất bản sao để giữ lâu dài.</p>`}}
function complete(i){if(!data.completed.includes(lessons[i].id)){data.completed.push(lessons[i].id);earn(20)}render()}function markFlash(g){schedule(cardIndex,g);earn(g?10:2);cardIndex=(cardIndex+1)%words.length;flipped=false;render()}
function revealReview(i) {
  if (!due(i)) return;
  revealedReviews.add(words[i][7]);
  render();
}
function rateReview(i, good) {
  if (!due(i) || !revealedReviews.delete(words[i][7])) return;
  schedule(i, good);
  if (good) earn(10);
  else stamp();
  render();
}

function newQuiz(){let i=Math.floor(Math.random()*words.length);let choices=[i];while(choices.length<4){let j=Math.floor(Math.random()*words.length);if(!choices.includes(j)&&words[j][2]!==words[i][2])choices.push(j)}choices.sort(()=>Math.random()-.5);quiz={i,choices,selected:null}}function renderQuiz(v){if(!quiz)newQuiz();let selected=quiz.selected,w=words[quiz.i];v.innerHTML=`<h1>🎯 Thử thách từ vựng</h1><p class="muted">Chọn nghĩa tiếng Việt đúng. Mỗi đáp án đúng nhận 15 XP.</p><div class="card"><span class="pill">${w[3]}</span><p class="muted">Từ này có nghĩa là gì?</p><div class="hanzi" style="font-size:62px">${w[0]}</div><h3>${w[1]} <button class="btn secondary" onclick="speak(${quiz.i})">🔊</button></h3>${quiz.choices.map(i=>`<button class="choice ${selected!==null?(i===quiz.i?'correct':i===selected?'wrong':''):''}" ${selected!==null?'disabled':''} onclick="answer(${i})">${words[i][2]}</button>`).join('')}${selected!==null?`<div class="feedback"><b>${selected===quiz.i?'🎉 Chính xác! +15 XP':'💡 Chưa đúng, thử ghi nhớ nhé!'}</b><p>${w[0]} (${w[1]}) — ${w[2]}</p><p>${w[4]} (${w[5]}) — ${w[6]}</p></div><button class="btn" onclick="newQuiz();render()">Câu tiếp theo →</button>`:''}</div>`}function answer(i) {
  if (!quiz || quiz.selected !== null || !quiz.choices.includes(i)) return;
  quiz.selected = i;
  const correct = i === quiz.i;
  data.quizTotal++;
  if (correct) data.quizCorrect++;
  schedule(quiz.i, correct);
  earn(correct ? 15 : 2);
  render();
}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chinese-quest-progress.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.learned)||!Array.isArray(x.completed)||typeof x.xp!=='number')throw Error();data=normalizeProgress(x);revealedReviews.clear();save();render();alert('Đã nhập tiến độ!')}catch{alert('Tệp tiến độ không hợp lệ.')}};r.readAsText(f)}render();
</script></body></html>
